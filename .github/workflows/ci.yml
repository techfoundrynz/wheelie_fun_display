name: CI, firmware and previews
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the configured firmware version after all checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect a firmware version increase
        id: version
        run: python scripts/release_version.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install clang-format==23.1.0 ruff==0.17.1
      - run: python scripts/format_cpp.py --check
      - run: python -m ruff format --check scripts tests
      - run: python tests/format_cpp_tests.py
      - run: python tests/prepare_slint_fonts_tests.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S tests -B .cache/host-tests -G Ninja -DBIKE_SANITIZERS=ON
      - run: cmake --build .cache/host-tests && ctest --test-dir .cache/host-tests --output-on-failure
      - name: Check release and preview publication policies
        run: |
          python tests/release_version_tests.py
          python tests/package_release_tests.py
          python tests/flash_artifacts_tests.py
          python tests/publish_pages_tests.py
          python tests/preview_archive_tests.py
          node --test tests/preview_publish_tests.cjs

  native-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            simulator/target
          key: ui-${{ runner.os }}-${{ hashFiles('simulator/Cargo.lock', 'simulator/Cargo.toml') }}
          restore-keys: ui-${{ runner.os }}-
      - name: Install native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev
      - name: Check Rust formatting
        run: |
          cargo fmt --check --manifest-path simulator/Cargo.toml
          cargo fmt --check --manifest-path simulator/web/Cargo.toml
      - name: Check navigation, gestures and settings at all target layouts
        run: |
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 410 502
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 502 410
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 480 800
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 800 480
      - name: Check layouts and disconnected controls on both displays
        run: |
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 410 502 --tuning-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 502 410 --tuning-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 480 800 --tuning-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 800 480 --tuning-fixtures
      - name: Check Ride status priority and responsive cards
        run: |
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 410 502 --ride-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 502 410 --ride-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 480 800 --ride-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 800 480 --ride-fixtures
      - name: Verify all four touch transforms against rendered pixels
        run: |
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 410 502 --rotation-fixtures
          cargo run --locked --manifest-path simulator/Cargo.toml --bin transition-checks -- 480 800 --rotation-fixtures
          cmake -S tests -B .cache/host-tests -G Ninja -DBIKE_SANITIZERS=ON -DBIKE_RENDERER_FIXTURES=${{ github.workspace }}/.cache/transition-checks
          cmake --build .cache/host-tests
          ctest --test-dir .cache/host-tests --output-on-failure -R orientation_renderer
          .cache/host-tests/orientation_renderer_tests .cache/transition-checks 480 800

  firmware:
    needs: [plan, format, tests, native-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0 -r requirements-release.txt
      - run: pio run
      - run: python scripts/check_sdkconfig.py --all
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/releases/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, firmware, pages]
    if: github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.plan.outputs.version }}

  pages:
    needs: firmware
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
