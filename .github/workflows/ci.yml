name: CI, firmware and previews
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the configured firmware version after all checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect unpublished firmware version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_version.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install clang-format==23.1.0 ruff==0.17.1
      - run: python scripts/format_cpp.py --check
      - run: python -m ruff format --check scripts tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S tests -B .cache/host-tests -G Ninja -DBIKE_SANITIZERS=ON
      - run: cmake --build .cache/host-tests && ctest --test-dir .cache/host-tests --output-on-failure
      - name: Discover Python unit tests
        run: python -m unittest discover -s tests -p '*_tests.py' -v
      - name: Discover Node tests
        run: node --test tests/*_tests.cjs

  native-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            simulator/target
          key: ui-${{ runner.os }}-${{ hashFiles('simulator/Cargo.lock', 'simulator/Cargo.toml', 'simulator/web/Cargo.lock', 'simulator/web/Cargo.toml') }}
          restore-keys: ui-${{ runner.os }}-
      - name: Install native renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev
      - name: Check Rust formatting
        run: |
          cargo fmt --check --manifest-path simulator/Cargo.toml
          cargo fmt --check --manifest-path simulator/web/Cargo.toml
      - name: Discover native simulator tests
        run: cargo test --locked --manifest-path simulator/Cargo.toml
      - name: Verify browser simulator credential handling
        run: cargo test --locked --manifest-path simulator/web/Cargo.toml --lib --target-dir simulator/target
      - name: Verify all four touch transforms against rendered pixels
        run: |
          cmake -S tests -B .cache/host-tests -G Ninja -DBIKE_SANITIZERS=ON -DBIKE_RENDERER_FIXTURES=${{ github.workspace }}/.cache/transition-checks
          cmake --build .cache/host-tests
          ctest --test-dir .cache/host-tests --output-on-failure -R orientation_renderer
          .cache/host-tests/orientation_renderer_tests .cache/transition-checks 480 800

  firmware:
    needs: [plan, format, tests, native-simulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0 -r requirements-release.txt
      - name: Cache verified Slint release downloads
        uses: actions/cache@v4
        with:
          path: .pio/cache/slint
          key: slint-firmware-${{ runner.os }}-${{ hashFiles('platformio.ini', 'firmware/components/slint_runtime/release-hashes.cmake') }}
      - run: pio run
      - run: python scripts/check_sdkconfig.py --all
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/releases/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, firmware, pages]
    if: github.event_name != 'pull_request' && needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.plan.outputs.version }}

  pages:
    needs: firmware
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
