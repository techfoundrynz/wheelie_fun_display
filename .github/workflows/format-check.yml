name: Format Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install clang-format==23.1.0
      - name: Check handwritten C++ (exclude third-party runtime)
        run: python scripts/format_cpp.py --check
      - name: Check declaration spacing rules
        run: python tests/format_cpp_tests.py
      - name: Check immutable Slint font resource preparation
        run: python tests/prepare_slint_fonts_tests.py
