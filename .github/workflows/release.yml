name: Publish validated firmware
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: firmware-release
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: .pio/releases
      - name: Validate release version and artifact integrity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, sys, subprocess
          sys.path.insert(0, 'scripts')
          from project_config import version
          from release_version import version_key
          expected = os.environ['RELEASE_VERSION']
          version_key(expected)
          assert expected == version(), 'Release version differs from source'
          root = Path('.pio/releases')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['version'] == expected
          for item in manifest['images'] + manifest['installers'] + [manifest['notices']]:
              path = (root / item['file']).resolve()
              assert path.is_relative_to(root.resolve())
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
          references = json.loads((root / 'source-references.json').read_text())
          assert references['application']['commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert references['application']['worktree_dirty'] is False
          PY
      - name: Create immutable version tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          TAG="v${RELEASE_VERSION}"
          TARGET_SHA=$(git rev-parse HEAD)
          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-parse "$TAG^{commit}")" = "$TARGET_SHA" || { echo "Tag already belongs to another commit"; exit 1; }
            tag_exists=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! "$tag_exists"; then echo "Published release has no verified local tag"; exit 1; fi
            git push origin "refs/tags/$TAG"
            echo "This commit is already published; leaving its assets unchanged"
            exit 0
          fi
          if ! "$tag_exists"; then git tag "$TAG" "$TARGET_SHA"; fi
          git push origin "refs/tags/$TAG"
          args=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" .pio/releases/*.bin .pio/releases/manifest.json .pio/releases/licenses.zip .pio/releases/source-references.json --verify-tag --target "$TARGET_SHA" --title "$TAG" --generate-notes "${args[@]}"
