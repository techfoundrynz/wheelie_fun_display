[platformio]
default_envs =
    waveshare_esp32s3_206
    guition_jc4880p443c
src_dir = firmware/main

[common]
custom_firmware_version = 0.1.2
platform = espressif32@8.0.0
framework = espidf
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-riscv32-esp@15.2.0+20251204
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.maximum_size = 7340032
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args =
    -DSLINT_PREBUILT_REPO=techfoundrynz/slint
    -DSLINT_PREBUILT_TAG=mcu-v1.19.5
    -DSLINT_PREBUILT_VERSION=1.19.0
    -DPROJECT_VER=${common.custom_firmware_version}
    -DWFD_BLE_BENCHMARK=OFF
monitor_speed = 115200
extra_scripts =
    pre:scripts/pio_toolchain.py
    pre:scripts/pio_build.py
    post:scripts/slint_resources.py
monitor_filters = esp32_exception_decoder
build_flags = -std=gnu++20

; Optional vehicle interfaces belong in this target's build_flags once wired:
; CAN_TX + CAN_RX: ESP32 TWAI signals to an external CAN transceiver.
; UART_TX + UART_RX: vehicle UART signals (BIKE_UART_PORT defaults to 1).
; CAN_BITRATE defaults to 500000; CAN_LOCAL_ID to 254; UART_BAUD to 115200.
; Omitting a pin pair keeps that interface unavailable in Settings.

[waveshare_esp32s3_206]
extends = common
custom_hardware_label = Waveshare ESP32-S3 AMOLED 2.06
custom_board_driver = waveshare_qspi
custom_sdkconfig_defaults = config/sdkconfig.s3
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
build_flags =
    ${common.build_flags}
    -DHOR_RES=410
    -DVER_RES=502
    -DDISPLAY_SAFE_INSET_X=38
    -DDISPLAY_SAFE_INSET_Y=24
    -DI2C_SDA=15
    -DI2C_SCL=14
    -DDISP_SDIO0=4
    -DDISP_SDIO1=5
    -DDISP_SDIO2=6
    -DDISP_SDIO3=7
    -DDISP_CLK=11
    -DDISP_QSPI_HZ=80000000
    -DDISP_CS=12
    -DDISP_CO5300=1
    -DPANEL_X_GAP=22
    -DDISP_RST=8
    -DDISP_BL=13
    -DTP_FT3168=1
    -DTP_INT=38
    -DTP_RST=9

[env:waveshare_esp32s3_206]
extends = waveshare_esp32s3_206

[guition_jc4880p443c]
extends = common
board = guition_jc4880p443c
custom_hardware_label = GUITION JC4880P443C 4.3
custom_board_driver = guition_p4
custom_sdkconfig_defaults = config/sdkconfig.p4
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    ${common.build_flags}
    -DHOR_RES=480
    -DVER_RES=800
    -DDISPLAY_SAFE_INSET_X=24
    -DDISPLAY_SAFE_INSET_Y=24
    -DDISPLAY_NATIVE_RGB565=1
    -DDISPLAY_ROTATION=90
    -DDISP_DSI_LANES=2
    -DDISP_DSI_MBPS=500
    -DDISP_DPI_CLOCK_MHZ=34
    -DDISP_RST=5
    -DDISP_BL=23
    -DI2C_SDA=7
    -DI2C_SCL=8
    -DTP_RST=3
    -DTP_INT=-1

[env:guition_jc4880p443c]
extends = guition_jc4880p443c
