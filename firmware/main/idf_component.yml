dependencies:
  idf: ">=6.1,<6.2"
  espressif/cjson: "1.7.19~2"
  espressif/esp_lcd_touch: "1.2.1"
  espressif/esp_lcd_sh8601:
    version: "2.0.1~1"
    rules:
      - if: "target == esp32s3"
  espressif/esp_lcd_touch_ft5x06:
    version: "1.1.1"
    rules:
      - if: "target == esp32s3"

  espressif/esp_lcd_touch_gt911:
    version: "1.2.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.5"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "3.1.0"
    rules:
      - if: "target == esp32p4"
